<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build-revision" content="2026-06-04-gallery-scroll-fixed">
  <title>社畜10連ガチャ</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f8fb;
      --muted: #a7b0bd;
      --line: rgba(255, 255, 255, 0.15);
      --accent: #37d3c0;
      --gold: #ffcc4d;
      --danger: #ff4d5e;
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070c;
    }

    body {
      display: grid;
      place-items: center;
      color: var(--ink);
    }

    button { font: inherit; }

    .stage-shell {
      width: min(100vw, 177.7778vh);
      height: min(56.25vw, 100vh);
      display: grid;
      place-items: center;
      background: #05070c;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 38%, rgba(55, 211, 192, 0.14), transparent 28%),
        linear-gradient(145deg, #0a1018, #05070c 58%, #0b0709);
      transition: background 0.55s ease;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(3, 7, 12, 0.28), rgba(3, 7, 12, 0.62)),
        url("assets/backgrounds/anime-office-bg.png") center / cover no-repeat;
      opacity: 0.82;
      transition: opacity 0.45s ease, filter 0.45s ease;
      pointer-events: none;
    }

    .stage.playing::before {
      opacity: 0;
    }

    .stage.result::before,
    .stage.detail::before {
      opacity: 0.92;
      filter: saturate(1.1) brightness(0.86);
    }

    .stage.playing {
      background:
        linear-gradient(180deg, rgba(20, 31, 43, 0.82) 0 56%, rgba(9, 12, 18, 0.98) 56% 100%),
        radial-gradient(circle at 50% 0%, rgba(61, 214, 198, 0.18), transparent 35%);
    }

    .stage.result,
    .stage.detail {
      background:
        radial-gradient(circle at 50% 28%, rgba(255, 204, 77, 0.16), transparent 26%),
        radial-gradient(circle at 18% 78%, rgba(55, 211, 192, 0.16), transparent 28%),
        linear-gradient(145deg, #080a13, #15111f 48%, #061820);
    }

    .intro {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      padding: 6%;
      text-align: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .stage.playing .intro,
    .stage.result .intro,
    .stage.detail .intro {
      opacity: 0;
      transform: translateY(-18px);
      pointer-events: none;
    }

    .intro-content {
      display: grid;
      justify-items: center;
      gap: clamp(18px, 2.2vw, 34px);
    }

    .brand-mini {
      display: none;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 118px);
      line-height: 1;
      letter-spacing: 0;
      text-shadow:
        0 0 30px rgba(55, 211, 192, 0.55),
        0 0 70px rgba(255, 77, 94, 0.22);
    }

    .pull-button,
    .again-button,
    .title-button,
    .back-button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 0;
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.18s ease;
    }

    .pull-button {
      width: min(450px, 72vw);
      min-height: clamp(60px, 7.8vw, 92px);
      color: #071014;
      font-size: clamp(19px, 2.25vw, 34px);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), transparent 42%),
        linear-gradient(135deg, #f8fafc, #ffcc4d 40%, #37d3c0);
      box-shadow:
        0 11px 0 #31514d,
        0 24px 48px rgba(55, 211, 192, 0.28),
        inset 0 0 0 2px rgba(255, 255, 255, 0.52);
    }

    .pull-button span {
      display: block;
      color: #7f1d1d;
      font-size: clamp(12px, 1.05vw, 16px);
      font-weight: 900;
    }

    .intro-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .menu-button {
      min-width: 150px;
      min-height: 38px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 8px;
      color: #f8fafc;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(15, 118, 110, 0.72));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      font-size: clamp(13px, 1vw, 16px);
      font-weight: 900;
    }

    .pull-button:hover,
    .again-button:hover,
    .title-button:hover,
    .menu-button:hover,
    .back-button:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }

    .pull-button:active,
    .again-button:active,
    .title-button:active,
    .menu-button:active,
    .back-button:active {
      transform: translateY(5px);
    }

    .office {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
      transition: opacity 0.55s ease, transform 0.55s ease, filter 0.55s ease;
    }

    .stage.playing .office {
      opacity: 1;
      transform: scale(1);
    }

    .stage.result .office,
    .stage.detail .office {
      opacity: 0;
      transform: scale(1.02);
      filter: blur(2px) saturate(0.7);
    }

    .result-bg {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease;
      background:
        conic-gradient(from 20deg at 50% 48%, transparent 0deg, rgba(255, 204, 77, 0.1) 16deg, transparent 32deg, rgba(55, 211, 192, 0.1) 52deg, transparent 68deg),
        repeating-linear-gradient(90deg, transparent 0 72px, rgba(255, 255, 255, 0.04) 73px 74px);
      mask-image: radial-gradient(circle at 50% 50%, #000 0 72%, transparent 100%);
    }

    .stage.result .result-bg,
    .stage.detail .result-bg {
      opacity: 1;
      animation: resultRays 18s linear infinite;
    }

    .ceiling {
      position: absolute;
      inset: 0 0 auto;
      height: 13%;
      background:
        linear-gradient(90deg, transparent 0 8%, rgba(255, 255, 255, 0.08) 8.5% 28%, transparent 28.5% 40%, rgba(255, 255, 255, 0.08) 40.5% 63%, transparent 63.5% 73%, rgba(255, 255, 255, 0.08) 73.5% 94%, transparent 94.5%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.1), transparent);
    }

    .windows {
      position: absolute;
      inset: 15% 6% auto;
      height: 34%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.2%;
      opacity: 0.86;
    }

    .window {
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(180deg, #15283c, #0c1420 72%),
        repeating-linear-gradient(90deg, transparent 0 28px, rgba(255, 255, 255, 0.08) 29px 31px);
      box-shadow: inset 0 0 32px rgba(0, 0, 0, 0.4);
    }

    .window::before {
      content: "";
      position: absolute;
      inset: 12% 10%;
      background:
        linear-gradient(90deg, transparent 0 12%, rgba(255, 204, 77, 0.52) 12.5% 17%, transparent 17.5% 42%, rgba(61, 214, 198, 0.35) 42.5% 48%, transparent 48.5% 70%, rgba(255, 255, 255, 0.25) 70.5% 75%, transparent 75.5%),
        repeating-linear-gradient(180deg, transparent 0 18px, rgba(255, 255, 255, 0.08) 19px 20px);
      opacity: 0.8;
    }

    .desk {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 0;
      height: 31%;
      border-top: 4px solid rgba(255, 255, 255, 0.12);
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.2), transparent 16% 84%, rgba(0, 0, 0, 0.24)),
        linear-gradient(180deg, #654832, #2a1d17);
    }

    .hud {
      position: absolute;
      z-index: 5;
      top: 4%;
      left: 4%;
      right: 4%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.4s ease 0.25s, transform 0.4s ease 0.25s;
      pointer-events: none;
    }

    .stage.playing .hud {
      opacity: 1;
      transform: translateY(0);
    }

    .result-label {
      position: absolute;
      z-index: 10;
      top: 4%;
      left: 4%;
      opacity: 0;
      transform: translateY(-10px);
      color: #f8fafc;
      font-size: clamp(28px, 4vw, 64px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 24px rgba(255, 204, 77, 0.42);
      transition: opacity 0.32s ease, transform 0.32s ease;
      pointer-events: none;
    }

    .stage.result .result-label {
      opacity: 1;
      transform: translateY(0);
    }

    .brand-mini {
      display: none;
      gap: 4px;
      min-width: 0;
    }

    .brand-mini h2 {
      margin: 0;
      font-size: clamp(20px, 3vw, 48px);
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 0 24px rgba(61, 214, 198, 0.5);
    }

    .brand-mini p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(10px, 1vw, 15px);
    }

    .rates {
      display: none;
      justify-items: end;
      gap: 4px;
      color: #d7e2ed;
      font-size: clamp(10px, 0.86vw, 14px);
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.85);
    }

    .clock-wrap {
      position: absolute;
      z-index: 5;
      top: 14%;
      right: 8%;
      display: grid;
      justify-items: center;
      gap: 7px;
      opacity: 0;
      transform: translateY(-14px) scale(0.92);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .stage.playing .clock-wrap,
    .stage.result .clock-wrap,
    .stage.detail .clock-wrap {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .stage.result .clock-wrap,
    .stage.detail .clock-wrap {
      opacity: 0;
      pointer-events: none;
    }

    .clock {
      position: relative;
      width: clamp(86px, 10vw, 150px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 7px solid #eceff4;
      background:
        radial-gradient(circle, #fff 0 5%, transparent 6%),
        linear-gradient(180deg, #f8fafc, #d9e0e8);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.35),
        inset 0 0 0 2px rgba(0, 0, 0, 0.08);
    }

    .clock::before {
      content: "12";
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      color: #1f2937;
      font-size: clamp(10px, 1vw, 14px);
      font-weight: 800;
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      width: 4px;
      border-radius: 999px;
      transform-origin: 50% 100%;
      background: #1f2937;
      transition: transform 1.4s cubic-bezier(.22,.8,.22,1);
    }

    .clock.instant .hand {
      transition: none;
    }

    .hour { height: 26%; transform: translateX(-50%) rotate(270deg); }
    .minute { height: 37%; transform: translateX(-50%) rotate(0deg); background: #ff4d5e; }
    .clock.done .hour { transform: translateX(-50%) rotate(540deg); }
    .clock.done .minute { transform: translateX(-50%) rotate(360deg); }
    .clock.overtime .hour { transform: translateX(-50%) rotate(780deg); }
    .clock.overtime .minute { transform: translateX(-50%) rotate(720deg); }

    .time-label {
      min-width: 90px;
      padding: 5px 10px;
      border-radius: 6px;
      text-align: center;
      color: #f8fafc;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid var(--line);
      font-weight: 800;
      font-size: clamp(12px, 1.2vw, 18px);
    }

    .laptop {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 15%;
      width: min(34vw, 60vh);
      aspect-ratio: 16 / 10;
      transform: translateX(-50%) translateY(28px);
      opacity: 0;
      border: 7px solid #0a1019;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 24%),
        linear-gradient(145deg, #152235, #071019);
      box-shadow:
        0 22px 40px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      transition: opacity 0.45s ease 0.15s, transform 0.45s ease 0.15s;
    }

    .stage.playing .laptop,
    .stage.result .laptop,
    .stage.detail .laptop {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .stage.result .laptop,
    .stage.detail .laptop {
      opacity: 0;
      pointer-events: none;
    }

    .laptop::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -15%;
      height: 18%;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(180deg, #1d2733, #0b1118);
      box-shadow: 0 16px 20px rgba(0, 0, 0, 0.36);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 6%;
      background:
        linear-gradient(90deg, rgba(61, 214, 198, 0.12), transparent 22% 78%, rgba(255, 77, 94, 0.1)),
        repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 2px 8px);
    }

    .screen.bluescreen {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 24%),
        linear-gradient(145deg, #0066d9, #003a9b);
      animation: screenJolt 0.16s linear 8;
    }

    .screen.bluescreen .screen-title,
    .screen.bluescreen .screen-body,
    .screen.bluescreen .screen-status {
      visibility: hidden;
    }

    .screen.bluescreen::before {
      content: ":(";
      position: absolute;
      left: 9%;
      top: 14%;
      color: rgba(255, 255, 255, 0.94);
      font-size: clamp(38px, 6vw, 92px);
      line-height: 1;
      font-weight: 300;
    }

    .screen.bluescreen::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 14%;
      top: 50%;
      height: 30%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.88) 0 10%, transparent 10% 23%, rgba(255, 255, 255, 0.75) 23% 31%, transparent 31% 48%, rgba(255, 255, 255, 0.6) 48% 55%, transparent 55%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.72) 0 10px, transparent 10px 17px);
      opacity: 0.9;
    }

    .screen-title {
      color: #d7fff9;
      font-weight: 800;
      font-size: clamp(11px, 1.15vw, 18px);
    }

    .screen-body {
      display: grid;
      place-items: center;
      gap: 7px;
      text-align: center;
      color: #c6d3df;
      font-size: clamp(10px, 1vw, 16px);
    }

    .pc-icon {
      width: clamp(44px, 6vw, 88px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid rgba(61, 214, 198, 0.7);
      display: grid;
      place-items: center;
      color: #3dd6c6;
      box-shadow: 0 0 26px rgba(61, 214, 198, 0.25);
      transition: transform 0.35s ease, color 0.35s ease, border-color 0.35s ease;
    }

    .pc-icon.punch {
      transform: scale(1.16);
      color: #ffcc4d;
      border-color: #ffcc4d;
      box-shadow: 0 0 34px rgba(255, 204, 77, 0.44);
    }

    .pc-icon svg {
      width: 58%;
      height: 58%;
    }

    .screen-status {
      display: none;
    }

    .mail-board {
      position: absolute;
      z-index: 9;
      inset: 15% 4.4% 14%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: clamp(8px, 1vw, 16px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .mail-board.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .stage.result .mail-board {
      inset: 13% 3% 22%;
      gap: clamp(6px, 0.76vw, 12px);
    }

    .stage.detail .mail-board,
    .stage.detail .again-area,
    .stage.detail .status {
      opacity: 0;
      pointer-events: none;
    }

    .mail {
      position: relative;
      min-width: 0;
      min-height: 0;
      opacity: 0;
      transform: translateY(-22px) scale(0.9);
    }

    .mail.in {
      animation: mailIn 0.42s cubic-bezier(.2,.9,.22,1.2) forwards;
    }

    .mail-card {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(78px, 42%) auto 1fr auto;
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid var(--rarity-line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(230, 236, 244, 0.97));
      color: #111827;
      box-shadow:
        0 16px 30px rgba(0, 0, 0, 0.34),
        0 0 26px var(--rarity-glow);
      transform: rotateX(8deg);
      transform-origin: 50% 100%;
    }

    .stage.result .mail-card,
    .mail.opened .mail-card {
      grid-template-rows: auto 1fr;
      background: rgba(3, 7, 12, 0.5);
      border-width: 3px;
      transform: none;
    }

    .stage.result .mail-head,
    .stage.result .type-tag,
    .stage.result .mail-body,
    .stage.result .mail-foot,
    .mail.opened .mail-head,
    .mail.opened .type-tag,
    .mail.opened .mail-body,
    .mail.opened .mail-foot {
      display: none;
    }

    .result-caption {
      display: none;
    }

    .stage.result .result-caption,
    .mail.opened .result-caption {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      min-height: 34px;
      padding: 5px 7px;
      color: #f8fafc;
      background:
        linear-gradient(135deg, rgba(6, 11, 18, 0.94), rgba(22, 31, 44, 0.86)),
        var(--rarity-bg);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.65);
    }

    .result-caption-type,
    .result-caption-rarity {
      display: inline-grid;
      place-items: center;
      height: 22px;
      padding: 0 6px;
      border-radius: 6px;
      color: #071014;
      background: rgba(255, 255, 255, 0.9);
      font-size: clamp(8px, 0.68vw, 11px);
      font-weight: 900;
      white-space: nowrap;
    }

    .result-caption-name {
      display: none;
    }

    .stage.result .icon-button,
    .mail.opened .icon-button {
      height: 100%;
      border-radius: 5px;
    }

    .sealed-mail {
      display: none;
    }

    .mail.sealed .mail-card {
      grid-template-rows: 1fr;
      transform: rotateX(8deg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(222, 230, 240, 0.98));
      border-color: var(--rarity-line);
      box-shadow:
        0 16px 30px rgba(0, 0, 0, 0.34),
        0 0 26px var(--rarity-glow);
    }

    .mail.sealed .mail-head,
    .mail.sealed .result-caption,
    .mail.sealed .icon-button,
    .mail.sealed .type-tag,
    .mail.sealed .mail-body,
    .mail.sealed .mail-foot {
      display: none;
    }

    .mail.sealed .sealed-mail {
      position: relative;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 28% 24%, rgba(255, 255, 255, 0.34), transparent 24%),
        linear-gradient(145deg, rgba(238, 244, 250, 0.96), rgba(214, 224, 236, 0.98));
    }

    .envelope-svg {
      position: relative;
      z-index: 1;
      width: min(78%, 180px);
      aspect-ratio: 220 / 140;
      overflow: visible;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.18));
      transform-origin: 50% 55%;
    }

    .envelope-body {
      fill: #ffffff;
      stroke: #251c1b;
      stroke-width: 8;
    }

    .envelope-line {
      fill: none;
      stroke: #251c1b;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mail.opening .envelope-svg {
      animation: envelopeOpen 0.5s ease-in forwards;
    }

    .mail.opening .sealed-mail {
      animation: envelopeFade 0.52s ease-in forwards;
    }

    .mail.sealed.sr .sealed-mail {
      background:
        radial-gradient(circle at 22% 22%, rgba(255, 255, 255, 0.38), transparent 22%),
        linear-gradient(145deg, #d7fff7, #80eadb);
    }

    .mail.sealed.ssr .mail-card {
      border-color: rgba(255, 204, 77, 1);
      box-shadow:
        0 0 26px rgba(255, 204, 77, 0.62),
        0 0 42px rgba(245, 158, 11, 0.42);
    }

    .mail.sealed.ssr .sealed-mail {
      background:
        radial-gradient(circle at 24% 24%, rgba(255, 255, 255, 0.5), transparent 21%),
        linear-gradient(145deg, #fff7c2, #ffcc4d 52%, #f59e0b);
    }

    .mail.sealed.ur .mail-card {
      border-color: transparent;
      background:
        linear-gradient(rgba(3, 7, 12, 0.62), rgba(3, 7, 12, 0.62)) padding-box,
        conic-gradient(from 0deg, #ff4d5e, #ffcc4d, #37d3c0, #60a5fa, #c084fc, #ff4d5e) border-box;
      box-shadow:

            </radialGradient>
            <pattern id="grid" width="${full ? 54 : 24}" height="${full ? 54 : 24}" patternUnits="userSpaceOnUse">
              <path d="M ${full ? 54 : 24} 0 L 0 0 0 ${full ? 54 : 24}" fill="none" stroke="#fff" stroke-opacity="${gridOpacity}" stroke-width="2"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#bg)"/>
          <rect width="100%" height="100%" fill="url(#glow)"/>
          <rect width="100%" height="100%" fill="url(#grid)"/>
          <circle cx="${full ? 780 : 192}" cy="${full ? 84 : 44}" r="${full ? 170 : 46}" fill="${accent}" opacity="0.13"/>
          <circle cx="${full ? 120 : 36}" cy="${full ? 432 : 204}" r="${full ? 190 : 58}" fill="#fff" opacity="0.08"/>
          ${motifSvg(item, width, full)}
          ${full ? `<text x="46" y="74" font-family="Segoe UI, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" opacity="0.9">${title}</text>
          <text x="50" y="112" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="${accent}" opacity="0.92">${item.typeLabel} / ${item.rarity}</text>` : `<text x="120" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="900" fill="#f8fafc">${item.rarity}</text>`}
        </svg>
      `;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    const assetVersion = "20260601-new-badge-fix";

    function imageFor(item, mode) {
      return `assets/gacha/${item.id}-${mode}.png?v=${assetVersion}`;
    }

    function unknownIcon() {
      return `<div class="unknown-icon">?</div>`;
    }

    function renderGallery(rarity = activeGalleryRarity) {
      activeGalleryRarity = rarity;
      const collection = getCollection();
      galleryTabs.innerHTML = rarities.map((entry) => `
        <button class="rarity-tab ${entry === rarity ? "active" : ""}" type="button" data-rarity="${entry}">${entry}</button>
      `).join("");
      galleryGrid.innerHTML = allItems()
        .filter((item) => item.rarity === rarity)
        .map((item) => {
          const count = collection[item.id] || 0;
          const locked = count <= 0;
          return `
            <div class="gallery-card ${locked ? "locked" : ""}">
              <button type="button" ${locked ? "disabled" : ""} data-id="${escapeHtml(item.id)}" aria-label="${escapeHtml(locked ? "未入手" : item.title)}">
                ${locked ? unknownIcon() : `<img src="${imageFor(item, "icon")}" alt="${escapeHtml(item.title)} アイコン">`}
              </button>
              ${locked ? "" : `<span class="count-badge">x${count}</span>`}
            </div>
          `;
        }).join("");
    }

    function showGallery() {
      renderGallery();
      galleryOverlay.classList.add("show");
      galleryOverlay.setAttribute("aria-hidden", "false");
    }

    function hideGallery() {
      galleryOverlay.classList.remove("show");
      galleryOverlay.setAttribute("aria-hidden", "true");
    }

    function percent(value) {
      return `${Number(value.toFixed(3))}%`;
    }

    function rateGroup(type, rarity, slot) {
      const typeRate = type === "character" ? 0.25 : 0.75;
      const rarityRates = slot === "last"
        ? { UR: 0.01, SSR: 0.04, SR: 0.95, R: 0 }
        : { UR: 0.01, SSR: 0.04, SR: 0.15, R: 0.8 };
      const pool = items[type].filter((item) => item.rarity === rarity);
      const groupRate = typeRate * (rarityRates[rarity] || 0) * 100;
      const itemRate = pool.length ? groupRate / pool.length : 0;
      return { pool, groupRate, itemRate };
    }

    function renderRates() {
      const sections = [
        ["通常枠（1〜9枚目）", "normal"],
        ["10枚目（SR以上確定）", "last"]
      ];
      ratesList.innerHTML = sections.map(([title, slot]) => `
        <section class="rate-section">
          <h3>${title}</h3>
          ${["UR", "SSR", "SR", "R"].map((rarity) => ["character", "skill"].map((type) => {
            const label = type === "character" ? "キャラ" : "スキル";
            const { pool, groupRate, itemRate } = rateGroup(type, rarity, slot);
            if (!pool.length || groupRate <= 0) return "";
            return `
              <div class="rate-row">
                <strong>${label}${rarity}: ${percent(groupRate)}</strong>
                <span>${pool.map((item) => `${escapeHtml(item.title)} ${percent(itemRate)}`).join(" / ")}</span>
              </div>
            `;
          }).join("")).join("")}
        </section>
      `).join("");
    }

    function showRates() {
      renderRates();
      ratesList.scrollTop = 0;
      ratesOverlay.classList.add("show");
      ratesOverlay.setAttribute("aria-hidden", "false");
    }

    function hideRates() {
      ratesOverlay.classList.remove("show");
      ratesOverlay.setAttribute("aria-hidden", "true");
    }

    function makeMail(item, index) {
      const typeLabel = item.typeLabel || (item.type === "character" ? "キャラ" : "スキル");
      const mail = document.createElement("article");
      mail.className = `mail sealed ${item.rarity.toLowerCase()} ${item.type}`;
      mail.style.animationDelay = `${index * 80}ms`;
      mail.innerHTML = `
        <div class="mail-card">
          <div class="mail-head">
            <div class="mail-from">${escapeHtml(item.from)}</div>
          </div>
          <div class="result-caption">
            <span class="result-caption-type">${escapeHtml(typeLabel)}</span>
            <strong class="result-caption-name">${escapeHtml(item.title)}</strong>
            <span class="result-caption-rarity">${escapeHtml(item.rarity)}</span>
          </div>
          <div class="sealed-mail" aria-hidden="true">
            <svg class="envelope-svg" viewBox="0 0 220 140" role="img" aria-label="メール">
              <rect class="envelope-body" x="16" y="24" width="188" height="92" rx="10"></rect>
              <path class="envelope-line" d="M22 31 L110 86 L198 31"></path>
              <path class="envelope-line" d="M22 109 L84 70"></path>
              <path class="envelope-line" d="M198 109 L136 70"></path>
            </svg>
          </div>
          <button class="icon-button" type="button" data-index="${index}" aria-label="${escapeHtml(item.title)} の全体画像を表示">
            <img src="${imageFor(item, "icon")}" alt="${escapeHtml(item.title)} アイコン">
            ${item.isNew ? '<span class="new-badge">NEW</span>' : ""}
          </button>
          <div class="type-tag">${escapeHtml(typeLabel)}</div>
          <div class="mail-body">
            <div class="subject">${escapeHtml(item.title)}</div>
            <div class="mail-preview">${escapeHtml(item.desc)}</div>
          </div>
          <div class="mail-foot">
            <span>未読メール ${String(index + 1).padStart(2, "0")}</span>
            <span>${item.rarity === "UR" ? "BLACK LEVEL MAX" : "要対応"}</span>
          </div>
        </div>
      `;
      return mail;
    }

    function resetScene() {
      mailBoard.classList.remove("show");
      mailBoard.replaceChildren();
      clock.classList.add("instant");
      clock.classList.remove("done", "overtime");
      pcIcon.classList.remove("punch");
      screenPanel.classList.remove("bluescreen");
      special.className = "special";
      special.replaceChildren();
      flash.classList.remove("pop");
      detailOverlay.setAttribute("aria-hidden", "true");
      hideGallery();
      hideRates();
      timeLabel.textContent = "9:00";
      void clock.offsetWidth;
      requestAnimationFrame(() => clock.classList.remove("instant"));
      screenMain.textContent = "退勤待機中";
      screenStatus.textContent = "ステータス: 仕事は終わった気がする";
    }

    async function animateClock() {
      const times = ["10:30", "12:00", "15:00", "17:30", "18:00"];
      for (const time of times) {
        timeLabel.textContent = time;
        await wait(210);
      }
      clock.classList.add("done");
      await wait(620);
    }

    async function playOvertimeSpecial() {
      flash.classList.remove("emergency-pop");
      void flash.offsetWidth;
      flash.classList.add("emergency-pop");
      special.className = "special emergency";
      special.innerHTML = `
        <div class="special-card">
          <div class="special-icon">EMERGENCY</div>
          <h2 class="special-title">退勤失敗警報</h2>
          <p class="special-copy">18:00を過ぎても、未処理アラートが止まらない。</p>
        </div>
      `;
      special.classList.add("show");
      await wait(2600);
      special.classList.remove("show");
      flash.classList.remove("emergency-pop");
      await wait(240);
      const times = ["18:30", "21:00", "23:30", "00:00", "02:00"];
      for (const time of times) {
        timeLabel.textContent = time;
        await wait(360);
      }
      clock.classList.add("overtime");
      await playSpecial({
        type: "emergency",
        icon: "02:00",
        title: "深夜二時 着地",
        copy: "定時退勤のはずが、時計だけがブラック案件の真実を告げる。"
      });
      await wait(500);
    }

    async function playBlueScreenSpecial() {
      screenPanel.classList.add("bluescreen");
      await wait(1900);
      screenPanel.classList.remove("bluescreen");
      await wait(320);
    }

    async function playSpecial(effect) {
      special.className = `special ${effect.type}`;
      special.innerHTML = `
        <div class="special-card">
          <div class="special-icon">${escapeHtml(effect.icon)}</div>
          <h2 class="special-title">${escapeHtml(effect.title)}</h2>
          <p class="special-copy">${escapeHtml(effect.copy)}</p>
        </div>
      `;
      special.classList.add("show");
      await wait(3000);
      special.classList.remove("show");
      await wait(180);
    }

    async function revealMails(draws) {
      mailBoard.classList.add("show");
      draws.forEach((item, index) => mailBoard.appendChild(makeMail(item, index)));
      await wait(70);
      [...mailBoard.children].forEach((mail, index) => {
        setTimeout(() => mail.classList.add("in"), index * 90);
      });
      await wait(980);
      [...mailBoard.children].forEach((mail, index) => {
        setTimeout(() => {
          mail.classList.add("opening");
          setTimeout(() => {
            mail.classList.remove("sealed", "opening");
            mail.classList.add("opened");
          }, 500);
        }, index * 125);
      });
      await wait(1780);
    }

    function openDetail(index) {
      const item = currentDraws[index];
      if (!item) return;
      detailReturnMode = "result";
      openItemDetail(item);
    }

    function openItemDetail(item) {
      detailImage.src = imageFor(item, "full");
      detailImage.alt = `${item.title} 全体画像`;
      detailType.textContent = item.typeLabel || (item.type === "character" ? "キャラ" : "スキル");
      detailRarity.textContent = item.rarity;
      detailRarityLarge.textContent = item.rarity;
      detailRarityLarge.dataset.rarity = item.rarity;
      detailTitle.textContent = item.title;
      detailDesc.textContent = item.desc;
      detailOverlay.setAttribute("aria-hidden", "false");
      stage.classList.remove("result", "intro-mode");
      stage.classList.add("detail");
    }

    function closeDetail() {
      detailOverlay.setAttribute("aria-hidden", "true");
      stage.classList.remove("detail");
      if (detailReturnMode === "gallery") {
        stage.classList.add("intro-mode");
        showGallery();
      } else {
        stage.classList.add("result");
      }
      detailReturnMode = "result";
    }

    async function pullTen() {
      if (busy) return;
      busy = true;
      button.disabled = true;
      againButton.disabled = true;
      titleButton.disabled = true;
      resetScene();
      stage.classList.remove("intro-mode", "result", "detail");
      stage.classList.add("playing");

      const draws = markNewItems(drawTen());
      currentDraws = draws;
      const hasUr = draws.some((item) => item.rarity === "UR");
      const specialEffect = hasUr && Math.random() < 0.7 ? nextSpecialEffect() : null;
      const willSpecial = Boolean(specialEffect);
      const best = hasUr ? "UR" : draws.some((item) => item.rarity === "SSR") ? "SSR" : "SR";
      const characterCount = draws.filter((item) => item.type === "character").length;

      statusText.textContent = "9:00から18:00まで時計が進みます...";
      screenStatus.textContent = "ステータス: 退勤チャンス接近中";
      await wait(450);
      await animateClock();
      if (specialEffect && specialEffect.mode === "overtime") {
        await playOvertimeSpecial();
      }

      statusText.textContent = "ノートPCで退勤打刻中...";
      screenMain.textContent = "退勤打刻";
      screenStatus.textContent = "ステータス: 勤怠を送信しています";
      pcIcon.classList.add("punch");
      await wait(620);
      if (specialEffect && specialEffect.mode === "bluescreen") {
        await playBlueScreenSpecial();
      }

      screenMain.textContent = "打刻完了";
      screenStatus.textContent = "ステータス: 未読メールを受信しました";
      flash.classList.add("pop");
      await wait(240);

      if (specialEffect && !specialEffect.mode) {
        statusText.textContent = "ブラック案件の気配...";
        await playSpecial(specialEffect);
      }

      statusText.textContent = "未読メール10通を開封中...";
      await revealMails(draws);

      stage.classList.remove("playing");
      stage.classList.add("result");
      if (best === "UR") {
        statusText.textContent = willSpecial ? `URブラック案件、特殊演出つきで着弾。キャラ${characterCount}件 / スキル${10 - characterCount}件` : `URブラック案件が着弾。キャラ${characterCount}件 / スキル${10 - characterCount}件`;
      } else if (best === "SSR") {
        statusText.textContent = `SSR級の残業フラグが着弾。キャラ${characterCount}件 / スキル${10 - characterCount}件`;
      } else {
        statusText.textContent = `SR以上1枚確定。キャラ${characterCount}件 / スキル${10 - characterCount}件`;
      }
      againButton.disabled = false;
      titleButton.disabled = false;
      busy = false;
    }

    button.addEventListener("click", pullTen);
    againButton.addEventListener("click", pullTen);
    galleryButton.addEventListener("click", showGallery);
    ratesButton.addEventListener("click", showRates);
    galleryClose.addEventListener("click", hideGallery);
    ratesClose.addEventListener("click", hideRates);
    galleryTabs.addEventListener("click", (event) => {
      const target = event.target.closest(".rarity-tab");
      if (!target) return;
      renderGallery(target.dataset.rarity);
    });
    galleryGrid.addEventListener("click", (event) => {
      const target = event.target.closest("button[data-id]");
      if (!target || target.disabled) return;
      const item = allItems().find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      hideGallery();
      detailReturnMode = "gallery";
      openItemDetail(item);
    });
    titleButton.addEventListener("click", () => {
      if (busy) return;
      resetScene();
      currentDraws = [];
      button.disabled = false;
      againButton.disabled = false;
      titleButton.disabled = false;
      stage.classList.remove("playing", "result", "detail");
      stage.classList.add("intro-mode");
    });
    backButton.addEventListener("click", closeDetail);
    mailBoard.addEventListener("click", (event) => {
      const target = event.target.closest(".icon-button");
      if (!target || !stage.classList.contains("result")) return;
      openDetail(Number(target.dataset.index));
    });
  </script>
</body>
</html>
